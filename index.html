<script>
  // Runs before first paint so a day-mode visitor never sees the dark theme
  // flash past. Must stay in step with readTheme() in src/hooks/useTheme.ts.
  try {
    document.documentElement.dataset.theme =
      localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
  } catch (e) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
