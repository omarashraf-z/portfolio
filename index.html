<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>
  // Runs before first paint so a returning day-mode visitor never sees the
  // dark theme flash past. A stored choice wins; otherwise night. Must stay
  // in step with readTheme() in src/hooks/useTheme.ts.
  (function () {
    var theme;
    try {
      var stored = localStorage.getItem('theme');
      theme = stored === 'light' || stored === 'dark' ? stored : null;
    } catch (e) {
      theme = null;
    }
    if (!theme) theme = 'dark';
    document.documentElement.dataset.theme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#faf9f7' : '#0a0a0a');
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
